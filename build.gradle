    /*// 冠军/强敌再续
    implementation fg.deobf("curse.maven:champions-unofficial-1074990:8005960")

    // 月之石
    implementation fg.deobf("curse.maven:moonstonemod-1234731:7766229")

    // 帕秋莉手册
    implementation fg.deobf("curse.maven:patchouli-306770:7731017")

    // 更多突变生物
    implementation fg.deobf("curse.maven:new-mutant-more-831753:7404733")

    // 铁魔法
    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:7691158")

    // 诡厄巫法
    implementation fg.deobf("curse.maven:goety-586095:7966952")*/

    /*// 神秘遗物
    implementation fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")

    // 神秘遗物扩展
    implementation fg.deobf("curse.maven:enigmatic-addons-1030121:7539683")*/

    // 传奇怪物
    implementation fg.deobf("curse.maven:legendary-monsters-944035:7628159")

    // L2 Lib
    runtimeOnly fg.deobf("curse.maven:l2library-620203:6806000")

    // 极简血量显示
    runtimeOnly fg.deobf("curse.maven:neat-238372:5838485")

    // 配置界面
